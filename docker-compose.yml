
# This Docker Compose file sets up Vaultwarden accessible via Tailscale.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-vw-service
    hostname: ${TAILSCALE_HOSTNAME:-vaultwarden-on-tailscale} # Hostname in your Tailnet
    env_file:
    - path: ./.env # Load integration test specific environment variables
      required: true # # This file is optional, so it won't fail if not present
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY:?err} #Tailscale auth key (TS_AUTHKEY) is not set in .env}
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME} # Optional, or set your preferred hostname
      - TS_ACCEPT_DNS=true # Accept DNS settings from Tailscale
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false # Run in kernel mode
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_CERT_DOMAIN=${TAILSCALE_HOSTNAME}.${TAILSCALE_DOMAIN}
      # Example: - TS_EXTRA_ARGS=--advertise-tags=tag:bitwarden --advertise-routes=10.0.0.0/24
    volumes:
      - ./data/tailscale_state:/var/lib/tailscale # Persistent state for Tailscale
      - ./ts_config:/config          # Mount directory containing serve.json
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
    
  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: vaultwarden-vw-service
    network_mode: service:tailscale # Crucial: Shares network stack with the tailscale container
    volumes:
      # Use a new directory for data to avoid conflicts if running alongside other instances
      - ./data/vaultwarden_data:/data
      - ./utilities/backup.sh:/backup.sh:ro
    depends_on:
      - tailscale # Ensures tailscale service (and its network) is up first
    environment:
    - LOG_FILE=/data/bitwarden.log
    - WEBSOCKET_ENABLED=true            # required for websockets
    - SHOW_PASSWORD_HINT=false
    - DOMAIN=https://${TAILSCALE_DOMAIN}          # DOMAIN is set in .env but doesn't have protocol prefix
    - SMTP_FROM_NAME=Bitwarden (${TAILSCALE_DOMAIN})
    - IP_HEADER=X-Forwarded-For
    - ADMIN_TOKEN                       # Value-less variables are set in .env
    - SIGNUPS_ALLOWED
    - SMTP_HOST
    - SMTP_FROM
    - SMTP_PORT
    - SMTP_SECURITY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - YUBICO_CLIENT_ID
    - YUBICO_SECRET_KEY
    - YUBICO_SERVER
    - ORG_CREATION_USERS
    - BACKUP
    - BACKUP_DAYS
    - BACKUP_DIR
    - BACKUP_EMAIL_FROM_NAME
    - BACKUP_ENCRYPTION_KEY
    - BACKUP_EMAIL_TO
    - BACKUP_EMAIL_NOTIFY
    - BACKUP_RCLONE_CONF
    - BACKUP_RCLONE_DEST
    command: >
      sh -c 'if [ -n "$BACKUP" ]; 
             then 
               apk --update --no-cache add sqlite && 
               ln -sf /proc/1/fd/1 /var/log/backup.log &&
               sed -i "/ash \\/backup\\.sh /d" /etc/crontabs/root &&
               echo "${BACKUP_SCHEDULE:-0 1 * * *} ash /backup.sh $BACKUP" >> /etc/crontabs/root &&
               crond -d 8;
             fi &&
             exec /start.sh'
    restart: unless-stopped
